<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Generate realistic fake JSON records from a type-spec or an inferred example schema — mock API responses without a backend, fully offline.">
  <title>API Mock Generator — Web Utility Suite</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar container">
    <a class="brand" href="https://github.com/kasapdev/web-utility-suite" aria-label="Back to Web Utility Suite">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </span>
      <span class="col" style="gap:0">
        <span>API Mock Generator</span>
        <span class="sub">Web Utility Suite</span>
      </span>
    </a>
    <span class="spacer"></span>

    <span id="statusBadge" class="badge" role="status" aria-live="polite" title="Schema status">
      <span class="status-dot" aria-hidden="true"></span><span id="statusText">Ready</span>
    </span>

    <button class="btn btn--icon" data-shortcut-help title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/>
      </svg>
    </button>
    <button class="btn btn--icon" data-theme-toggle title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <main class="container">
    <!-- Mode + toolbar -->
    <section class="panel toolbar-panel fade-in" aria-label="Schema mode">
      <div class="toolbar">
        <div class="segmented" role="tablist" aria-label="Schema input mode">
          <button id="tabTypeSpec" type="button" role="tab" aria-selected="true" class="is-active">Type-spec</button>
          <button id="tabExample" type="button" role="tab" aria-selected="false">Example object</button>
        </div>

        <span class="spacer hide-sm"></span>

        <div class="toolbar-group">
          <div class="field-inline">
            <label for="countInput">Records</label>
            <input type="number" id="countInput" min="1" max="500" value="10" style="width:80px">
          </div>
          <button id="btnGenerate" class="btn btn--primary" title="Generate fake records">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            Generate
          </button>
          <button id="btnRegenerate" class="btn btn--sm" title="Regenerate with same schema">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2v6h-6M3 22v-6h6M3 12a9 9 0 0 1 15-6.7L21 8M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            Regenerate
          </button>
        </div>
      </div>
    </section>

    <!-- Two-pane editor -->
    <section class="editor rise" aria-label="Schema and output">
      <!-- Input pane -->
      <div class="pane panel pane--input">
        <div class="pane-head">
          <h2 class="pane-title" id="inputPaneTitle">Type-spec</h2>
          <button id="btnInfer" class="btn btn--sm btn--ghost" title="Infer a type-spec from this example" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.663 17h4.673M12 3v1m6.364 1.636-.707.707M21 12h-1M4 12H3m3.343-5.657-.707-.707m2.121 12.021a6 6 0 1 1 6.486 0A3.5 3.5 0 0 0 14.5 19h-5a3.5 3.5 0 0 0-1.036-2.343"/></svg>
            Infer schema
          </button>
        </div>
        <textarea id="schemaInput" class="mono" spellcheck="false" autocapitalize="off" autocomplete="off"
          aria-label="Schema input"
          placeholder='{"id":"number","name":"string","email":"email","active":"boolean","tags":"string[]"}'></textarea>
      </div>

      <!-- Output pane -->
      <div class="pane panel pane--output">
        <div class="pane-head">
          <h2 class="pane-title">Output</h2>
          <span id="outputStats" class="muted pane-meta mono"></span>
        </div>

        <div class="output-scroll">
          <pre id="output" class="output-code mono" aria-live="polite" tabindex="0"><code id="outputCode"></code></pre>

          <div id="emptyState" class="empty output-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            <p>Your generated mock records will appear here.</p>
            <button id="btnSampleEmpty" class="btn btn--sm">Load a sample schema</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Error panel -->
    <section id="errorPanel" class="panel error-panel fade-in" role="alert" hidden>
      <div class="error-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
        <strong>Invalid schema</strong>
      </div>
      <p id="errorMsg" class="error-msg mono"></p>
    </section>

    <!-- Actions bar -->
    <section id="actionsBar" class="panel stats-bar fade-in" aria-label="Output actions" hidden>
      <div class="toolbar-group">
        <button id="btnCopy" class="btn btn--sm" title="Copy output JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <button id="btnDownload" class="btn btn--sm" title="Download .json">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Download
        </button>
      </div>
      <span class="spacer"></span>
      <div class="stat">
        <span class="stat-label">Fields</span>
        <span id="statFields" class="stat-value gradient-text">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Records</span>
        <span id="statRecords" class="stat-value">—</span>
      </div>
    </section>
  </main>

  <footer class="app-footer container">
    Part of the <a href="https://github.com/kasapdev/web-utility-suite">Web Utility Suite</a> · MIT Licensed
  </footer>

  <!-- Shortcuts help modal -->
  <div id="helpBackdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <div class="row between center" style="margin-bottom:var(--space-4)">
        <h3 id="helpTitle" style="margin:0">Keyboard shortcuts</h3>
        <button id="helpClose" class="btn btn--icon btn--ghost" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <table class="shortcut-table">
        <tbody id="shortcutRows"></tbody>
      </table>
      <p class="muted" style="margin:var(--space-4) 0 0;font-size:13px">Tip: <kbd>mod</kbd> means <kbd>Ctrl</kbd> on Windows/Linux and <kbd>⌘</kbd> on macOS.</p>
    </div>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
